<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:576px;height:1024px}
canvas{position:absolute;left:0;top:0;width:576px;height:1024px}
#title{position:absolute;left:0;right:0;top:250px;z-index:1;text-align:center;font-family:'Liberation Serif','FreeSerif',serif;font-weight:700;font-size:37px;line-height:1.12;color:#ffe7a0;padding-left:26px;padding-right:26px;text-shadow:0 2px 0 rgba(60,30,0,.7),0 0 14px rgba(0,0,0,.8);letter-spacing:.2px}
#title::before{content:'';position:absolute;left:-40px;right:-40px;top:-70px;bottom:-70px;z-index:-1;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(25,12,35,.6) 0%,rgba(25,12,35,.35) 55%,rgba(25,12,35,0) 100%)}
#hud{position:absolute;left:24px;top:468px;font-family:'Inter',sans-serif;color:#fff;text-shadow:0 0 8px rgba(0,0,0,.8)}
#hud .l{font-size:11px;font-weight:800;letter-spacing:1.6px;color:rgba(255,255,255,.85)}
#hud .n{font-size:34px;font-weight:900;color:#ffd21f;line-height:1.05;font-variant-numeric:tabular-nums}
#hud .s{font-size:11px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,.65);margin-top:4px}
#tag{position:absolute;right:22px;top:46px;font-family:'Inter',sans-serif;font-size:12px;font-weight:800;letter-spacing:1.5px;color:rgba(255,255,255,.8);text-shadow:0 0 8px rgba(0,0,0,.8);text-align:right}
</style></head><body><div id="stage"><canvas id="c"></canvas>
<div id="tag"></div><div id="title">What if all light<br>disappeared for 5 seconds?</div><div id="hud"></div></div>
<script type="importmap">{"imports":{"three":"/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W=576,H=1024,PR=1.25;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(PR);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(70,W/H,.1,400);
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const FOG=new THREE.Color('#f2b69a');scene.fog=new THREE.Fog(FOG,35,230);scene.background=new THREE.Color('#000');
const emis=[],basics=[],lights=[];
const reg=(m,k)=>{emis.push([m,k]);return m};
const regB=(m)=>{basics.push([m,m.color.clone()]);return m};
const std=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:0,...o});
const bx=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);

// lighting (golden-hour)
const hemi=new THREE.HemisphereLight('#a9c0ff','#8a6350',1.0);scene.add(hemi);lights.push([hemi,1.0]);
const sun=new THREE.DirectionalLight('#ffb27a',2.6);sun.position.set(-14,14,40);scene.add(sun);lights.push([sun,2.6]);
const pl=[['#ff3fa4',90],['#35d7ff',90],['#ffd21f',70]].map(([c,i])=>{const l=new THREE.PointLight(c,i,34,1.6);scene.add(l);lights.push([l,i]);return l});

// sky dome
const sky=(()=>{const c=document.createElement('canvas');c.width=8;c.height=256;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,256);
 g.addColorStop(0,'#2f4ea8');g.addColorStop(.45,'#8f9fe0');g.addColorStop(.62,'#f3b4b0');g.addColorStop(.72,'#ffcf9a');g.addColorStop(1,'#f2b69a');x.fillStyle=g;x.fillRect(0,0,8,256);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
 const m=regB(new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false,depthWrite:false}));const s=new THREE.Mesh(new THREE.SphereGeometry(380,24,16),m);s.position.y=-40;scene.add(s);return s})();

// ground
const road=bx(12,.1,400,std('#2c2e39',{roughness:.7}));road.position.set(0,-.05,-120);scene.add(road);
[-1,1].forEach(s=>{const w=bx(3.2,.3,400,std('#9a96a2'));w.position.set(s*7.6,.05,-120);scene.add(w)});
const yl=std('#f1c40f',{emissive:'#f1c40f',emissiveIntensity:.0});
[-.14,.14].forEach(x=>{const l=bx(.1,.02,400,yl);l.position.set(x,.01,-120);scene.add(l)});
const white=std('#e9e9ee');
[-14,-54].forEach(zc=>{for(let i=0;i<12;i++){const s=bx(.55,.02,3.2,white);s.position.set(-5.5+i,.012,zc);scene.add(s)}});
// lane dashes
for(let i=0;i<60;i++)[-3.0,3.0].forEach(x=>{const d=bx(.12,.02,1.6,white);d.position.set(x,.011,25-i*4);scene.add(d)});

// window texture + buildings
function winTex(warm){const c=document.createElement('canvas');c.width=64;c.height=128;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,64,128);
 const pal=warm?['#ffe29a','#ffc45a','#fff0c8','#ffd58a']:['#bfe6ff','#9fb4ff','#fff0c8','#ffd0f0'];
 for(let r=0;r<16;r++)for(let q=0;q<8;q++)if(rnd()<.5){x.fillStyle=pal[Math.floor(rnd()*pal.length)];x.fillRect(q*8+1,r*8+1,6,5)}
 const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}
const wm=[['#8c93b8',1],['#a79aa8',0],['#7d88ad',1],['#b0a3a0',0],['#6f7aa0',1]].map(([c,w])=>reg(std(c,{emissive:'#fff',emissiveMap:winTex(w),emissiveIntensity:.9,roughness:.9}),.9));
function building(w,h,d,cx,cz,m){const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
 for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;uv.setXY(i,uv.getX(i)*dims[f][0]/19.2,uv.getY(i)*dims[f][1]/51.2)}
 const b=new THREE.Mesh(g,m);b.position.set(cx,h/2,cz);scene.add(b);return b}
for(const s of [-1,1]){let z=26;while(z>-130){const d=10+rnd()*8,w=9+rnd()*8,h=20+rnd()*34;building(w,h,d,s*(9.1+w/2),z-d/2,wm[Math.floor(rnd()*wm.length)]);
  if(rnd()<.5){const h2=h+8+rnd()*10;building(w*.6,h2-h,d*.6,s*(9.1+w*.5+w*.1),z-d/2,wm[Math.floor(rnd()*wm.length)]).position.y=h+(h2-h)/2}
  z-=d+.3}}
// tower w/ antenna
const tw=building(14,55,14,-3,-84,wm[2]);const t2=building(9,14,9,-3,-84,wm[0]);t2.position.y=62;
const ant=bx(.7,14,.7,std('#555a70'));ant.position.set(-3,76,-84);scene.add(ant);
const beac=regB(new THREE.MeshBasicMaterial({color:'#ff3b3b'}));const bs=new THREE.Mesh(new THREE.SphereGeometry(.9,10,10),beac);bs.position.set(-3,83.5,-84);scene.add(bs);

// billboards (scrolling colour bars)
function bbCanvas(seedI){const c=document.createElement('canvas');c.width=128;c.height=512;const x=c.getContext('2d');const cols=['#ff2d95','#13c8ff','#ffd21f','#7a5cff','#ff7a2d','#2dffa0','#ffffff'];
 let y=0;while(y<512){const hh=40+Math.floor(rnd()*90);x.fillStyle=cols[Math.floor(rnd()*cols.length)];x.fillRect(0,y,128,hh);
  if(rnd()<.6){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(12,y+hh*.3,104,hh*.18);x.fillStyle='rgba(255,255,255,.9)';x.fillRect(12,y+hh*.62,60,hh*.1)}y+=hh}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}
const bbTex=[];for(let i=0;i<6;i++)bbTex.push(bbCanvas(i));
const bills=[];
for(const s of [-1,1])for(let i=0;i<22;i++){const z=18-i*5.2-rnd()*2;const hgt=7+rnd()*30,wd=4+rnd()*3.5,hh=6+rnd()*9;
 const m=regB(new THREE.MeshBasicMaterial({map:bbTex[Math.floor(rnd()*6)]}));const p=new THREE.Mesh(new THREE.PlaneGeometry(wd,hh),m);
 p.position.set(s*8.9,hgt+hh/2,z);p.rotation.y=-s*Math.PI/2;scene.add(p);bills.push(p)}
// street lamps / lit awnings at street level (low glow strips)
const strip=regB(new THREE.MeshBasicMaterial({color:'#ffe2a0'}));
for(const s of [-1,1])for(let i=0;i<16;i++){const z=14-i*7;const a=bx(.2,.2,3,strip);a.position.set(s*8.9,4.2,z);scene.add(a)}

// people
const cols=['#e63946','#1d9bf0','#ffd21f','#2ec27e','#ff7a2d','#9b5de5','#f5f5f5','#ff4da6'],skins=['#e8b894','#c98b5c','#8d5a3b','#f2cfae'];
const geo={leg:new THREE.BoxGeometry(.18,.8,.2),tor:new THREE.BoxGeometry(.5,.62,.28),head:new THREE.BoxGeometry(.24,.26,.24),arm:new THREE.BoxGeometry(.12,.55,.14)};
const mats={};const getM=c=>mats[c]||(mats[c]=std(c,{roughness:.85}));
const peds=[];
for(let i=0;i<170;i++){const g=new THREE.Group();const sh=cols[i%cols.length],sk=skins[i%4],pa=['#20243a','#3b3f58','#5b4636','#1f2a44'][i%4];
 const L1=new THREE.Mesh(geo.leg,getM(pa)),L2=L1.clone();[L1,L2].forEach((l,k)=>{l.geometry.translate(0,0,0);});
 const lg=[new THREE.Group(),new THREE.Group()];lg.forEach((q,k)=>{q.position.set(k?.12:-.12,.8,0);const l=new THREE.Mesh(geo.leg,getM(pa));l.position.y=-.4;q.add(l);g.add(q)});
 const tor=new THREE.Mesh(geo.tor,getM(sh));tor.position.y=1.11;g.add(tor);
 const hd=new THREE.Group();hd.position.y=1.55;const hb=new THREE.Mesh(geo.head,getM(sk));hd.add(hb);const hr=new THREE.Mesh(new THREE.BoxGeometry(.26,.1,.26),getM(['#201510','#4a3020','#a07a40','#111'][i%4]));hr.position.y=.12;hd.add(hr);g.add(hd);
 const ar=[-1,1].map(s=>{const a=new THREE.Group();a.position.set(s*.32,1.38,0);const m=new THREE.Mesh(geo.arm,getM(sh));m.position.y=-.26;a.add(m);g.add(a);return a});
 const lane=rnd();let x;if(lane<.38)x=(rnd()<.5?-1:1)*(6.3+rnd()*2.3);else x=(rnd()-.5)*10.5;
 const dir=rnd()<.5?-1:1;const sc=.92+rnd()*.2;g.scale.setScalar(sc);
 g.userData={x,z0:20-rnd()*130,dir,sp:1.1+rnd()*.7,ph:rnd()*6,lg,ar,hd,tor};g.rotation.y=dir<0?Math.PI:0;scene.add(g);peds.push(g)}
// cars
const cars=[];const carCols=['#f6c400','#f6c400','#f6c400','#f6c400','#f6c400','#e9e9ee','#26293a','#c0392b','#f6c400'];
function makeCar(c){const g=new THREE.Group();const m=std(c,{roughness:.5});const b=bx(1.9,.7,4.3,m);b.position.y=.65;const cab=bx(1.7,.6,2.3,std('#1a1d2b',{roughness:.3}));cab.position.set(0,1.2,-.1);const roof=bx(1.75,.12,2.1,m);roof.position.set(0,1.55,-.1);g.add(b,cab,roof);
 if(c==='#f6c400'){const sg=bx(.5,.18,.25,std('#fff0b0'));sg.position.set(0,1.7,-.1);g.add(sg)}
 const tl=regB(new THREE.MeshBasicMaterial({color:'#ff2020'}));[-.7,.7].forEach(x=>{const t=bx(.3,.16,.06,tl);t.position.set(x,.75,2.17);g.add(t)});
 const hl=regB(new THREE.MeshBasicMaterial({color:'#fff6c8'}));[-.7,.7].forEach(x=>{const t=bx(.3,.16,.06,hl);t.position.set(x,.75,-2.17);g.add(t)});
 [[-.95,1.3],[.95,1.3],[-.95,-1.3],[.95,-1.3]].forEach(([x,z])=>{const w=bx(.2,.6,.6,std('#111'));w.position.set(x,.3,z);g.add(w)});return g}
let ci=0;
for(const [x,dir] of [[-2.0,1],[2.0,-1],[-3.9,1],[3.9,-1]])for(let k=0;k<7;k++){const g=makeCar(carCols[(ci++)%carCols.length]);g.userData={x,dir,z0:20-k*17-rnd()*5,sp:4.5+rnd()*1.5,yaw:(rnd()-.5)*.5,sx:(rnd()-.5)*.8,mov:true};scene.add(g);cars.push(g)}
for(const s of [-1,1])for(let k=0;k<9;k++){const g=makeCar(carCols[(ci++)%carCols.length]);g.userData={x:s*5.25,dir:0,z0:14-k*13-rnd()*4,sp:0,mov:false};g.position.set(g.userData.x,0,g.userData.z0);scene.add(g);cars.push(g)}

// ---- timeline
const T_OFF=3.0,T_ON=8.0,END=13.5;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function Lvis(t){if(t<T_OFF)return 1;if(t<T_ON){const k=t-T_OFF;return .04*Math.exp(-k*16)}
 const k=t-T_ON;const fl=[[0,0],[.1,.9],[.2,.05],[.3,.7],[.38,0],[.55,1]];if(k>=.55)return 1;for(let i=0;i<fl.length-1;i++)if(k>=fl[i][0]&&k<fl[i+1][0])return fl[i][1];return 1}
const ct=t=>{const a=3.2,d=1.4;if(t<a)return t;if(t<a+d)return a+(t-a)-(t-a)*(t-a)/(2*d);return a+d/2};
const wt=t=>t<3.6?t:(t<9?3.6:3.6+(t-9)*.6);
const hud=document.getElementById('hud'),tag=document.getElementById('tag'),titleEl=document.getElementById('title');
const ZR=[-130,20];const wrap=z=>((z-ZR[0])%(ZR[1]-ZR[0])+(ZR[1]-ZR[0]))%(ZR[1]-ZR[0])+ZR[0];
window.render=function(t){
  const cz=16-2.7*t;
  camera.position.set(Math.sin(t*.7)*.12,3.3+Math.sin(t*5)*.025+Math.sin(t*1.3)*.03,cz);
  camera.lookAt(Math.sin(t*.5)*.4,9.2+Math.sin(t*.4)*.3,cz-40);
  const L=Lvis(t);
  lights.forEach(([l,b])=>l.intensity=b*L);emis.forEach(([m,b])=>m.emissiveIntensity=b*L);
  basics.forEach(([m,c])=>m.color.copy(c).multiplyScalar(L));
  scene.fog.color.copy(FOG).multiplyScalar(L);
  pl[0].position.set(-6,5,cz-9);pl[1].position.set(6,7,cz-18);pl[2].position.set(-5,4,cz-28);
  bbTex.forEach((tx,i)=>tx.offset.y=(t*(.08+i*.02))%1);
  const flick=t>=T_ON&&t<T_ON+.55;
  // cars
  const c=ct(t),brake=cl((t-3.2)/1.4);
  cars.forEach(g=>{const d=g.userData;if(!d.mov)return;const z=wrap(d.z0+d.dir*d.sp*c);
    g.position.set(d.x+d.sx*brake,0,z);g.rotation.y=(d.dir>0?0:Math.PI)+d.yaw*brake*(d.dir>0?1:-1)});
  // people
  const w=wt(t),after=t>=T_ON;
  peds.forEach(g=>{const d=g.userData;const z=wrap(d.z0+d.dir*d.sp*w);g.position.set(d.x,0,z);
    const moving=!(t>=3.6&&t<9);const ph=w*5.5*d.sp+d.ph;const sw=moving?Math.sin(ph)*.7:0;
    d.lg[0].rotation.x=sw;d.lg[1].rotation.x=-sw;d.ar[0].rotation.x=-sw*.7;d.ar[1].rotation.x=sw*.7;
    g.position.y=moving?Math.abs(Math.sin(ph))*.03:0;
    // after light returns: look up
    const up=after?cl((t-T_ON-.3)/.6)*-.55:0;d.hd.rotation.x=up;d.hd.rotation.y=after?Math.sin(t*1.5+d.ph)*.4:0;
    if(t>=T_OFF+.4&&t<T_ON){d.ar[0].rotation.x=-1.2;d.ar[1].rotation.x=-1.2}
    if(after){d.ar[0].rotation.x=-2.6*cl((t-T_ON-.2)/.5)*(d.ph>3?1:0);d.ar[1].rotation.x=-.6*cl((t-T_ON)/.5)}});
  bs.visible=(t*1.2)%1<.5;
  renderer.render(scene,camera);
  // HUD
  let lab,num,sub='';
  if(t<T_OFF){lab='LIGHT DISAPPEARS IN';num=(T_OFF-t).toFixed(1)+' s'}
  else if(t<T_ON){lab='LIGHT RETURNS IN';num=(T_ON-t).toFixed(1)+' s';sub='VISIBLE: NOTHING'}
  else{lab='LIGHT WAS GONE FOR';num='5.0 s';sub='TRAFFIC STOPPED · CROWD LOOKING UP'}
  hud.innerHTML=`<div class="l">${lab}</div><div class="n">${num}</div><div class="s">${sub}</div>`;
  tag.innerHTML='TIMES SQUARE<br>6:42 PM';
  titleEl.style.opacity=cl(t/.5);
  return L;
};
window.ready=true;
</script></body></html>
